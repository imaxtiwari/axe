[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "axe"
version = "0.1.0"
description = "AXE — Wall Street AI Co-pilot and Investment Operating System"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [
    { name = "AXE Team" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "openai>=1.35.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.3.0",
    "chromadb>=0.5.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "cryptography>=42.0.0",
    "aiofiles>=24.1.0",
    "pytz>=2024.1",
    "python-jose[cryptography]>=3.3.0",
    "tenacity>=8.5.0",
    "apscheduler>=3.10.0",
    "prometheus-client>=0.20.0",
    "sentry-sdk[fastapi]>=2.0.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "python-json-logger>=2.0.7",
    "boto3>=1.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "black>=24.4.0",
    "mypy>=1.10.0",
    "pyright>=1.1.350",
    "types-pytz",
    "respx>=0.21.0",
]
ocr = [
    "pymupdf>=1.24.0",
    "pytesseract>=0.3.10",
    "pillow>=10.3.0",
]
prod = [
    "gunicorn>=22.0.0",
]

[project.scripts]
axe = "axe.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/axe"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["axe"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=axe --cov-report=term-missing"

[tool.coverage.run]
source = ["src/axe"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 0

[dependency-groups]
dev = [
    "pdfplumber>=0.11.10",
    "pymupdf>=1.28.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]

# Re-enable once repository-wide test coverage reaches 85%.
# [tool.pytest.ini_options] currently sets cov-fail-under globally.
